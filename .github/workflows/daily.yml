name: 新闻每日简报

on:
  schedule:
    # Beijing 08:00 = UTC 00:00 (GitHub Actions cron runs in UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate daily digest
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://api.deepseek.com' }}
          API_MODEL: ${{ vars.API_MODEL || 'deepseek-chat' }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: cd scripts && python main.py

      - name: Commit and push
        run: |
          git config user.name "News Daily Bot"
          git config user.email "bot@github.com"
          DATE=$(TZ=Asia/Shanghai date +"%Y-%m-%d")
          git add daily/ data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          # 不 pull / 不 rebase：fetch 最新后 reset --soft，把本次生成的存档
          # 干净地叠加到最新 main 之上再提交，从原理上避免同文件冲突
          git fetch origin
          git reset --soft origin/main
          git commit -m "📰 新闻每日简报 for ${DATE}"
          git push origin main
