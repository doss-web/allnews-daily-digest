name: 新闻每日简报

on:
  schedule:
    # Beijing 08:00 = UTC 00:00 (GitHub Actions cron runs in UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate daily digest
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://api.deepseek.com' }}
          API_MODEL: ${{ vars.API_MODEL || 'deepseek-chat' }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: cd scripts && python main.py

      - name: Commit and push
        run: |
          git config user.name "News Daily Bot"
          git config user.email "bot@github.com"
          DATE=$(TZ=Asia/Shanghai date +"%Y-%m-%d")
          git add daily/ data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "📰 新闻每日简报 for ${DATE}"
          # 同步远端；若 rebase 冲突（同一天存档被多次提交），以本地本次生成为准重新提交
          git fetch origin
          if ! git pull --rebase origin main 2>&1; then
            echo "检测到 rebase 冲突，以本地生成为准重新提交"
            git rebase --abort 2>/dev/null || true
            git reset --soft origin/main
            git commit -m "📰 新闻每日简报 for ${DATE}"
          fi
          git push origin main
